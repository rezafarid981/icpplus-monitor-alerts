name: ICPPLUS Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: icpplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install matching ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      - name: Test ICPPLUS network access
        run: |
          echo "Testing Google connection..."
          curl -I -L --max-time 15 https://www.google.com

          echo "Testing ICPPLUS connection from GitHub runner..."
          if curl -sS -L --max-time 25 \
            -o /tmp/icpplus.html \
            -w "HTTP_STATUS=%{http_code}\nREMOTE_IP=%{remote_ip}\nDNS_TIME=%{time_namelookup}s\nCONNECT_TIME=%{time_connect}s\nTOTAL_TIME=%{time_total}s\n" \
            "https://icp.administracionelectronica.gob.es/icpplustieb/citar?p=8&locale=es"; then
            echo "CURL_EXIT=0"
          else
            echo "CURL_EXIT=$?"
          fi

          if [ -f /tmp/icpplus.html ]; then
            echo "BODY_BYTES=$(wc -c < /tmp/icpplus.html)"
            head -c 500 /tmp/icpplus.html
          fi
      - name: Run monitor
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated status
        run: |
          git config user.name "icpplus-monitor-bot"
          git config user.email "actions@github.com"
          git add data/status.json
          git diff --quiet --cached || git commit -m "Update status [skip ci]"
          git pull --rebase origin main
          git push
